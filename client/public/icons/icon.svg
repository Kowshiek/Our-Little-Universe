<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="60%" stop-color="#140e36"/>
      <stop offset="100%" stop-color="#0b081d"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8a65d4"/>
    </linearGradient>
    <linearGradient id="starGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="starGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="512" height="512" rx="110" fill="url(#spaceGrad)"/>

  <!-- Subtle Starlight Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#8a65d4" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Cosmic Nebula Clouds -->
  <ellipse cx="210" cy="220" rx="140" ry="90" fill="#ec4899" fill-opacity="0.15" filter="url(#glow)"/>
  <ellipse cx="300" cy="290" rx="150" ry="100" fill="#8a65d4" fill-opacity="0.2" filter="url(#glow)"/>

  <!-- Twinkling Micro Stars -->
  <circle cx="120" cy="110" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="390" cy="130" r="3.5" fill="#ffd166" opacity="0.9"/>
  <circle cx="90" cy="380" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="430" cy="390" r="3" fill="#f472b6" opacity="0.8"/>
  <circle cx="260" cy="80" r="4" fill="#ffffff" opacity="0.95"/>
  <circle cx="260" cy="440" r="3" fill="#ffffff" opacity="0.75"/>

  <!-- Central Cosmic Couple Heart -->
  <path d="M256,380 C256,380 130,290 130,200 C130,140 180,110 230,130 C242,135 251,144 256,155 C261,144 270,135 282,130 C332,110 382,140 382,200 C382,290 256,380 256,380 Z" 
        fill="url(#heartGrad)" filter="url(#glow)" opacity="0.92"/>

  <!-- Left Star (Player 1) -->
  <g transform="translate(205, 205)">
    <polygon points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7" fill="url(#starGrad1)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Right Star (Player 2) -->
  <g transform="translate(305, 215)">
    <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="url(#starGrad2)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Orbiting sparkle link between stars -->
  <path d="M205,205 Q256,180 305,215" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.8"/>
</svg>
